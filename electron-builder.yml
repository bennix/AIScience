appId: io.github.bennix.aiscience
productName: Science Workbench
copyright: Copyright © 2026 AIScience contributors
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - src/**/*
  - assets/**/*
  - formal-proofs/**/*
  - package.json
asar: true
asarUnpack:
  - formal-proofs/**
artifactName: AIScience-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.education
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: 'ZHIPING XU (5N66S29EK2)'
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
dmg:
  title: AIScience
  sign: true
  contents:
    - x: 150
      y: 180
    - x: 440
      y: 180
      type: link
      path: /Applications
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AIScience
linux:
  icon: build/icon.png
  category: Education
  maintainer: bennix <bennix@users.noreply.github.com>
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
publish: null

afterSign: scripts/notarize-app.cjs
