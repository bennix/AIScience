name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            pattern: release/*.exe
          - os: ubuntu-24.04
            command: dist:linux
            pattern: |
              release/*.deb
              release/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AIScience-${{ runner.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "AIScience $GITHUB_REF_NAME" --generate-notes
          for f in release/*.exe release/*.deb release/*.rpm; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              gh release upload "$GITHUB_REF_NAME" "$f" "$f.sha256" --clobber
            fi
          done
